<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create an account with Abrar Bedsheet Kabal.">
  <title>Account | Abrar Bedsheet Kabal</title>
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <video class="site-bg-video site-bg-video--primary" autoplay muted loop playsinline aria-hidden="true">
    <source src="bed.mp4" type="video/mp4">
  </video>
  <video class="site-bg-video site-bg-video--secondary" autoplay muted loop playsinline aria-hidden="true">
    <source src="bed2.mp4" type="video/mp4">
  </video>

  <main class="auth-shell">
    <a class="wordmark auth-wordmark" href="index.html" aria-label="Return to Abrar Bedsheet Kabal home">
      <img class="brand-logo" src="logo.png" alt="Abrar Bedsheet Kabal logo">
      <span class="wordmark__main">Abrar</span><span class="wordmark__sub">Bedsheet Kabal</span>
    </a>

    <section class="auth-card" aria-labelledby="authTitle">
      <p class="eyebrow">Your restful corner</p>
      <h1 id="authTitle">Welcome <em>back.</em></h1>
      <p class="auth-intro" id="authIntro">Sign in to save your favorites and keep your bedding orders close.</p>

      <form id="authForm" class="auth-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
        <button class="button button--dark button--full" type="submit" id="submitButton">Sign in <span>↗</span></button>
      </form>

      <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
      <button class="auth-switch" type="button" id="modeButton">New here? Create an account</button>
      <a class="auth-home-link" href="index.html">Continue shopping <span>→</span></a>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
